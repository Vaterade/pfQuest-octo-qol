name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      # Vendored Ace2 libraries contain valid Lua 5.0 that newer compilers reject.
      - name: Check Lua syntax
        run: find . -name '*.lua' -not -path '*/Libs/*' -print0 | xargs -0 -n1 luac5.4 -p
